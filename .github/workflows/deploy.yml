name: Deploy frontend to GitHub Pages

# Builds the Vite app under app/ and publishes app/dist to the
# gh-pages branch. The published URL ends up at
#   https://<owner>.github.io/<repo>/
# matching vite.config.ts's `base: "/novoed-toolkit/"` so the
# Pages URL must end with /novoed-toolkit/ — repo name = novoed-toolkit.
# If the repo is renamed, update vite.config.ts base + this workflow's
# documentation, and Pages will rebuild on next push.
#
# Per BCG IT pre-pilot conversation: GitHub Pages is the only
# free + approved + practical hosting path right now. Vercel
# requires $300/seat/month for SAML SSO; Azure Static Web Apps
# needs a sponsor cost code (chicken-and-egg with the pilot).
# Pages ships today; auth is handled via the existing Claude CLI
# subscription (see urgent-fix-prompt-size for the auth path).
#
# Backend (agent-backend) is NOT deployed by this workflow — it
# stays local on each LD's laptop. Frontend on Pages talks to
# ws://localhost:8766; modern browsers carve out localhost as an
# exception to mixed-content rules, so https-frontend ↔
# http-localhost works without extra TLS plumbing.

on:
  push:
    branches: [main]
    # Only trigger when the frontend or this workflow changes —
    # backend / docs commits don't burn Actions minutes.
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  # Allow manual re-deploy from the Actions tab.
  workflow_dispatch:

# Pages deploys are sticky — a queued newer deploy should cancel
# any in-flight older one. concurrency group "pages" so multiple
# pushes within a minute coalesce to the latest.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write  # peaceiris pushes the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/dist
          publish_branch: gh-pages
          # Friendly commit message on the gh-pages branch so the
          # branch history is readable. Includes the source SHA.
          commit_message: 'deploy: ${{ github.sha }}'
