[project]
name = "agent-backend"
version = "0.1.0"
description = "Claude agent backend for the NovoEd toolkit course builder"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "claude-agent-sdk>=0.1.63",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "pypdf>=4.3",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
    # Track-F + Track-T: explicit httpx + certifi + truststore for the
    # Pexels HTTPS proxy. Track-F's first attempt (verify=certifi.where()
    # as a string path) didn't bind on Windows. Track-T builds a real
    # ssl.SSLContext via truststore (preferred — Windows native cert
    # store) with certifi as the fallback, and passes the context to
    # httpx.AsyncClient. truststore is a small dep (~12KB) but the
    # most reliable Windows fix; certifi is the cross-platform safety
    # net.
    "httpx>=0.27",
    "certifi>=2024.7",
    "truststore>=0.9",
]
