    <!-- Inter (Phase 2 #2 A2) — primary app font.
         Variable axis (wght 100..900) so the browser pulls one file
         and we get full weight range. font-feature-settings on body
         in src/index.css enables Inter's stylistic alternates.
         Preconnect speeds up the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    />

    <title>NovoEd Toolkit</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
